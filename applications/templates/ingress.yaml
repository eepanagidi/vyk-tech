# ──────────────────────────────────────────────
# Ingress
#
# Local access (no real DNS):
#   Add to /etc/hosts:  127.0.0.1  vyking.local
#   Then:  http://vyking.local:8080  → frontend (which proxies /api/* → backend)
#
# The backend is intentionally NOT exposed via its own ingress — it is reachable
# only through the frontend's /api proxy, and the backend NetworkPolicy enforces
# frontend-only access (defense in depth). See applications/templates/networkpolicy.yaml.
# ──────────────────────────────────────────────

# ── Frontend Ingress ──────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vyking-apps.labels" . | nindent 4 }}
    {{- include "vyking-apps.frontend.selectorLabels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Proxy the /api/ path to the backend service
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- if .Values.ingress.tls.enabled }}
    # cert-manager issues the TLS cert for the host below from this ClusterIssuer.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    # Redirect plain HTTP → HTTPS once the cert is in place.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Connection timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # Rate limiting (requests per second per IP)
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vyking-apps.frontend.name" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
