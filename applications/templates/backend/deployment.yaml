{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  # Name includes environment: backend-production, backend-staging, backend-local
  name: {{ include "vyking-apps.backend.name" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vyking-apps.labels" . | nindent 4 }}
    {{- include "vyking-apps.backend.selectorLabels" . | nindent 4 }}
  annotations:
    {{- include "vyking-apps.protectionAnnotations" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vyking-apps.backend.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.backend.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.backend.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        {{- include "vyking-apps.labels" . | nindent 8 }}
        {{- include "vyking-apps.backend.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "vyking-apps.protectionAnnotations" . | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "vyking-apps.backend.name" . }}
      automountServiceAccountToken: false
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "vyking-apps.backend.selectorLabels" . | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.backend.securityContext.runAsUser }}
        runAsGroup: {{ .Values.backend.securityContext.runAsGroup }}
        fsGroup: {{ .Values.backend.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-credentials
                  key: mysql-password
            - name: MYSQL_USER
              value: "appuser"
          envFrom:
            - configMapRef:
                name: app-config-{{ .Values.global.environment }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.probes.readiness | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.backend.probes.startup | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
