{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vyking-apps.frontend.name" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vyking-apps.labels" . | nindent 4 }}
    {{- include "vyking-apps.frontend.selectorLabels" . | nindent 4 }}
  annotations:
    {{- include "vyking-apps.protectionAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "vyking-apps.frontend.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.frontend.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.frontend.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        {{- include "vyking-apps.labels" . | nindent 8 }}
        {{- include "vyking-apps.frontend.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "vyking-apps.protectionAnnotations" . | nindent 8 }}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "vyking-apps.frontend.name" . }}
      automountServiceAccountToken: false
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "vyking-apps.frontend.selectorLabels" . | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.frontend.securityContext.runAsUser }}
        runAsGroup: {{ .Values.frontend.securityContext.runAsGroup }}
        fsGroup: {{ .Values.frontend.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.targetPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.frontend.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.frontend.probes.readiness | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.frontend.probes.startup | nindent 12 }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config-{{ .Values.global.environment }}
            defaultMode: 0440
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
