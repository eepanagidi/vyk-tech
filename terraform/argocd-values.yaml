# ──────────────────────────────────────────────
# ArgoCD Helm values — security + RBAC hardened
# ──────────────────────────────────────────────

global:
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

configs:
  params:
    server.insecure: "true"    # TLS terminated at load-balancer in local setup

  cm:
    # Health check for child Applications (App of Apps)
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

    # ArgoCD tracks all resource groups by default. We intentionally do NOT set
    # resource.inclusions: restricting it silently drops any resource in a group
    # outside the list (StorageClass, Gatekeeper CRDs/Constraints, admission
    # webhooks), which makes apps report "Synced" while those resources are
    # never actually applied.

  # ── ArgoCD RBAC policy ─────────────────────
  # Principle: default deny; named roles with explicit grants
  rbac:
    policy.default: ""    # No access unless explicitly granted (empty = deny all)
    policy.csv: |
      # ── Built-in roles (reference) ────────────────────────────────────────
      # role:admin   — full access (Terraform SA only)
      # role:readonly — read-only across all apps
      #
      # ── Platform admins: full access ──────────────────────────────────────
      p, role:platform-admin, applications, *, */*, allow
      p, role:platform-admin, clusters,     *, */*, allow
      p, role:platform-admin, repositories, *, */*, allow
      p, role:platform-admin, projects,     *, */*, allow
      p, role:platform-admin, accounts,     *, */*, allow
      p, role:platform-admin, gpgkeys,      *, */*, allow
      g, platform-admins, role:platform-admin

      # ── Deployers: sync apps but cannot delete or manage clusters ──────────
      p, role:deployer, applications, get,    */*, allow
      p, role:deployer, applications, sync,   */*, allow
      p, role:deployer, applications, action, */*, allow
      p, role:deployer, repositories, get,    */*, allow
      p, role:deployer, projects,     get,    */*, allow
      g, platform-deployers, role:deployer

      # ── Read-only: view only, no mutations ────────────────────────────────
      p, role:viewer, applications, get,  */*, allow
      p, role:viewer, clusters,     get,  */*, allow
      p, role:viewer, repositories, get,  */*, allow
      p, role:viewer, projects,     get,  */*, allow
      g, platform-readonly, role:viewer

    scopes: "[groups]"

# ── Component resource limits ──────────────────
server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi # Bitnami MySQL chart rendering is memory-heavy; 512Mi/1Gi both OOMed under concurrent refreshes
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

notifications:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
