# ──────────────────────────────────────────────
# MySQL Backup CronJob
# Schedule: every 5 min (demo) → "0 2 * * *" for production
# Security: non-root, readOnlyRootFilesystem, drop ALL caps
# Credentials: secretKeyRef — never hardcoded
# ──────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: infrastructure
  labels:
    app.kubernetes.io/name: mysql-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/managed-by: argocd
    environment: local
    project: vyking-platform
    owner: platform-team
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 120

  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mysql-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/managed-by: argocd
        spec:
          serviceAccountName: mysql-backup
          automountServiceAccountToken: false
          restartPolicy: OnFailure

          # ── Scheduling ────────────────────────
          # Tolerate worker node taint (same taint as other workloads)
          tolerations:
            - key: "role"
              operator: "Equal"
              value: "worker"
              effect: "NoSchedule"
          nodeSelector:
            role: worker

          # ── Pod security ──────────────────────
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: backup
              image: bitnami/mysql:8.0.36    # Pinned — includes mysqldump
              imagePullPolicy: IfNotPresent

              command:
                - /bin/bash
                - -euo
                - pipefail
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/appdb_${TIMESTAMP}.sql.gz"

                  echo "[$(date)] Starting backup → ${BACKUP_FILE}"

                  # Pass credentials via a temp defaults file (mktemp → mode 600)
                  # so the password never appears in the process list / cmdline.
                  CNF=$(mktemp /tmp/my.cnf.XXXXXX)
                  trap 'rm -f "${CNF}"' EXIT
                  printf '[client]\nhost=%s\nport=%s\nuser=%s\npassword=%s\n' \
                    "${MYSQL_HOST}" "${MYSQL_PORT}" "${MYSQL_USER}" "${MYSQL_PASSWORD}" > "${CNF}"

                  mysqldump \
                    --defaults-extra-file="${CNF}" \
                    --single-transaction \
                    --routines \
                    --triggers \
                    --set-gtid-purged=OFF \
                    "${MYSQL_DATABASE}" \
                  | gzip > "${BACKUP_FILE}"

                  echo "[$(date)] Backup complete: ${BACKUP_FILE} ($(du -sh ${BACKUP_FILE} | cut -f1))"

                  # Retention: keep last 288 files (~24h at 5-min intervals)
                  ls -t /backups/*.sql.gz 2>/dev/null | tail -n +289 | xargs --no-run-if-empty rm -v

              env:
                - name: MYSQL_HOST
                  value: "mysql.infrastructure.svc.cluster.local"
                - name: MYSQL_PORT
                  value: "3306"
                - name: MYSQL_DATABASE
                  value: "appdb"
                - name: MYSQL_USER
                  value: "root"
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-credentials
                      key: mysql-root-password

              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1001
                capabilities:
                  drop: ["ALL"]

              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mysql-backup-storage
            - name: tmp
              emptyDir: {}
