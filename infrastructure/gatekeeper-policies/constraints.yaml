# ──────────────────────────────────────────────
# Gatekeeper Constraints — activate the DeletionProtection ConstraintTemplate
# for resource types that must never be accidentally deleted.
#
# sync-wave "2": applied after the ConstraintTemplate (wave 1), which follows
# the Gatekeeper controller (wave 0). The app sets SkipDryRunOnMissingResource
# because the DeletionProtection CRD is generated by Gatekeeper from the
# template at runtime (so it may not exist on the first sync pass).
# ──────────────────────────────────────────────

# Protect PersistentVolumeClaims (database data)
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DeletionProtection
metadata:
  name: protect-pvcs
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/component: policy
    app.kubernetes.io/managed-by: argocd
    project: vyking-platform
spec:
  # Deny deletes outright — this is real protection, not just a warning.
  # Authorized deletion uses the vyking.io/deletion-override=true annotation
  # (see the ConstraintTemplate message); teardown.sh lifts the constraints
  # before `terraform destroy`, and `k3d cluster delete` bypasses admission.
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["PersistentVolumeClaim"]
    # Only enforce on namespaces that carry stateful workloads
    namespaces: ["infrastructure"]

---
# Protect StatefulSets (MySQL pod spec + VolumeClaimTemplates)
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DeletionProtection
metadata:
  name: protect-statefulsets
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/component: policy
    app.kubernetes.io/managed-by: argocd
    project: vyking-platform
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["StatefulSet"]
    namespaces: ["infrastructure"]

---
# Protect Secrets that hold DB credentials
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DeletionProtection
metadata:
  name: protect-db-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/component: policy
    app.kubernetes.io/managed-by: argocd
    project: vyking-platform
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Secret"]
    namespaces: ["infrastructure", "applications"]

---
# Protect the ArgoCD MySQL Application itself
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: DeletionProtection
metadata:
  name: protect-argocd-db-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/component: policy
    app.kubernetes.io/managed-by: argocd
    project: vyking-platform
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["argoproj.io"]
        kinds: ["Application"]
    namespaces: ["argocd"]
