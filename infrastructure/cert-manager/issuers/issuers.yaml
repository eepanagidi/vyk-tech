# ──────────────────────────────────────────────
# Local CA trust chain (cert-manager)
#
#   SelfSigned ClusterIssuer  →  CA Certificate  →  CA ClusterIssuer
#
# A bootstrap self-signed issuer mints one CA cert; the CA ClusterIssuer then
# signs every leaf cert (frontend ingress, ArgoCD server) so they share a single
# trust root. In production you'd replace `vyking-ca-issuer` with a Let's Encrypt
# ACME issuer or a real corporate CA — the consumers (Ingress / Certificate
# resources) reference the issuer by name and don't change.
# ──────────────────────────────────────────────

# 1) Bootstrap: a self-signed issuer used only to mint the CA below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vyking-selfsigned-issuer
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: pki
spec:
  selfSigned: {}

---
# 2) The local CA certificate (self-signed by the bootstrap issuer). Its key pair
#    lands in the cert-manager namespace, where ClusterIssuers look it up.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vyking-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: pki
spec:
  isCA: true
  commonName: vyking-local-ca
  secretName: vyking-ca-key-pair
  duration: 87600h # 10 years — local root CA
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vyking-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
# 3) The CA ClusterIssuer that signs all platform leaf certs.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vyking-ca-issuer
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: pki
spec:
  ca:
    secretName: vyking-ca-key-pair
