# ──────────────────────────────────────────────
# Child ArgoCD Application: Gatekeeper
#
# Deployed first (before mysql + backup) so that
# admission policies are active before any stateful
# resources are created.
#
# Sync wave -1 ensures it deploys before all other
# infrastructure apps (wave 0 is default).
# ──────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: policy
    app.kubernetes.io/managed-by: argocd
    environment: local
    project: vyking-platform
    owner: platform-team
  annotations:
    # Wave 0 alongside MySQL/backup so a slow/unhealthy policy controller never
    # blocks the database. Constraints are applied later by gatekeeper-policies.
    argocd.argoproj.io/sync-wave: "0"
    vyking.io/deletion-protected: "true"
spec:
  project: default # operator install needs broad cluster RBAC (CRDs, webhooks, ClusterRoles)
  sources:
    - repoURL: https://open-policy-agent.github.io/gatekeeper/charts
      chart: gatekeeper
      targetRevision: "3.16.3"           # Pinned
      helm:
        values: |
          replicas: 1                    # 1 replica for local; 3 for production
          # Intercept DELETE admissions. Gatekeeper's webhook defaults to
          # CREATE+UPDATE only; without this the DeletionProtection policy (which
          # fires on operation==DELETE) would never trigger — the whole point of
          # the policy is to guard deletes.
          enableDeleteOperations: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Apply the webhook configs client-side (the app default is
          # ServerSideApply=true for the large CRDs). The SSA dry-run that
          # computes sync status does NOT honor the `.webhooks` ignoreDifferences,
          # so under SSA these objects sit permanently OutOfSync even though the
          # real diff is empty. Client-side apply respects the ignore -> Synced.
          validatingWebhookAnnotations:
            argocd.argoproj.io/sync-options: ServerSideApply=false
          mutatingWebhookAnnotations:
            argocd.argoproj.io/sync-options: ServerSideApply=false
    # ConstraintTemplate only (Constraints live in the gatekeeper-policies app,
    # which syncs after the template's generated CRD exists).
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      path: infrastructure/gatekeeper
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  # Ignore ONLY the fields the Gatekeeper controller injects at runtime, NOT the
  # whole `.webhooks` array — ignoring all of it also hid the git-managed
  # operations/rules, so enableDeleteOperations never synced. Narrow ignores:
  #   - clientConfig.caBundle — the controller injects the TLS cert; permanent drift.
  #   - matchConditions (k8s 1.28+) — not in ArgoCD's bundled schema; under SSA it
  #     crashed the typed diff (status Unknown). The webhooks use client-side apply
  #     (see *WebhookAnnotations above) so this is belt-and-suspenders now.
  # operations/rules stay diffed, so the DELETE rule reconciles correctly.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: gatekeeper-mutating-webhook-configuration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.matchConditions'
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: gatekeeper-validating-webhook-configuration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.matchConditions'
  syncPolicy:
    automated:
      prune: false      # Never auto-prune policy resources
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # DeletionProtection CRD is generated by Gatekeeper at runtime
      # ServerSideApply computes sync status via a server-side dry-run that, by
      # default, does NOT honor ignoreDifferences — so the webhook configs stayed
      # OutOfSync even though `argocd app diff` was empty. This makes the dry-run
      # respect the ignoreDifferences above, so the app reports Synced.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
