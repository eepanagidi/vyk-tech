# ──────────────────────────────────────────────
# Child ArgoCD Application: cert-manager issuers (local CA + leaf certs)
#
# Directory-based (raw cert-manager CRs, not a chart): the self-signed → CA →
# CA-issuer trust chain plus the ArgoCD server certificate.
#
# project: default — creates cluster-scoped ClusterIssuers and a cert in the
# argocd namespace. sync-wave -1: after cert-manager (wave -2) so the CRDs +
# webhook exist. SkipDryRunOnMissingResource because the cert-manager CRDs are
# installed by the wave -2 app and may not exist on the first sync pass.
# ──────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: pki
    app.kubernetes.io/managed-by: argocd
    environment: local
    project: vyking-platform
    owner: platform-team
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: infrastructure/cert-manager/issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
