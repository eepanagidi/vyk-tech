# ──────────────────────────────────────────────
# Child ArgoCD Application: Gatekeeper
#
# Deployed first (before mysql + backup) so that
# admission policies are active before any stateful
# resources are created.
#
# Sync wave -1 ensures it deploys before all other
# infrastructure apps (wave 0 is default).
# ──────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: policy
    app.kubernetes.io/managed-by: argocd
    environment: local
    project: vyking-platform
    owner: platform-team
  annotations:
    # Wave 0 alongside MySQL/backup so a slow/unhealthy policy controller never
    # blocks the database. Constraints are applied later by gatekeeper-policies.
    argocd.argoproj.io/sync-wave: "0"
    vyking.io/deletion-protected: "true"
spec:
  project: default # operator install needs broad cluster RBAC (CRDs, webhooks, ClusterRoles)
  sources:
    - repoURL: https://open-policy-agent.github.io/gatekeeper/charts
      chart: gatekeeper
      targetRevision: "3.16.3"           # Pinned
      helm:
        values: |
          replicas: 1                    # 1 replica for local; 3 for production
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    # ConstraintTemplate only (Constraints live in the gatekeeper-policies app,
    # which syncs after the template's generated CRD exists).
    - repoURL: https://github.com/eepanagidi/vyk-tech.git
      targetRevision: platform
      path: infrastructure/gatekeeper
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  syncPolicy:
    automated:
      prune: false      # Never auto-prune policy resources
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # DeletionProtection CRD is generated by Gatekeeper at runtime
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
